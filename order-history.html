<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History - Charm and Corner Creations</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fffaf7;color:#3a2722}header{background:#3a2722;color:#fff;padding:18px 20px;position:sticky;top:0}.wrap{max-width:1050px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.back{background:#fff;color:#3a2722;text-decoration:none}.danger{background:#b42318;color:#fff}.summary{background:#f4e7e1;padding:16px;border-radius:14px;margin:18px 0}.order{background:#fff;border:1px solid #eaded8;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #0000000a}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.id{font-weight:800;font-size:18px}.muted{color:#766861}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:8px 4px;border-bottom:1px solid #eee;text-align:left}.table th:last-child,.table td:last-child{text-align:right}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:50px 10px;background:#fff;border-radius:14px}.small{font-size:13px}.customer{line-height:1.6}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.table{font-size:13px}}
</style></head><body><header><div class="wrap top" style="padding:0 16px"><div><b>Charm and Corner Creations</b><div class="small">Order History</div></div><a class="btn back" href="index.html">← Back to Store</a></div></header><main class="wrap"><div class="summary"><div><b>Total saved orders:</b> <span id="count">0</span></div><div class="small">Orders are saved in this browser on this device. Clearing browser/site data will remove them.</div></div><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn danger" onclick="clearAll()">Delete All Orders</button></div><div id="list"></div></main><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return Number(n).toLocaleString('en-BD')}
function getOrders(){try{return JSON.parse(localStorage.getItem('cccOrders')||'[]')}catch(e){return []}}
function render(){const orders=getOrders();document.getElementById('count').textContent=orders.length;const list=document.getElementById('list');if(!orders.length){list.innerHTML='<div class="empty"><h2>No orders yet</h2><p>Customer orders will appear here after they place an order.</p></div>';return}list.innerHTML=orders.map((o,i)=>`<section class="order"><div class="head"><div><div class="id">${esc(o.id)}</div><div class="muted">${esc(o.date)}</div></div><div><b>Total: ৳${money(o.total)}</b></div></div><div class="customer"><b>Customer:</b> ${esc(o.name)}<br><b>Phone:</b> ${esc(o.phone)}<br><b>Address:</b> ${esc(o.address)}<br><b>Payment:</b> ${esc(o.paymentLabel)}</div><table class="table"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead><tbody>${(o.cart||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>৳${money(p.price)}</td><td>৳${money(p.price*p.qty)}</td></tr>`).join('')}</tbody></table><div class="actions"><button class="btn" onclick="printOrder(${i})">Print Receipt</button><button class="btn" onclick="sendWhatsApp(${i})">Send to WhatsApp</button><button class="btn danger" onclick="deleteOrder(${i})">Delete</button></div></section>`).join('')}
function printOrder(i){const o=getOrders()[i];if(!o)return;const rows=o.cart.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>৳${money(p.price)}</td><td>৳${money(p.price*p.qty)}</td></tr>`).join('');const w=window.open('','_blank');w.document.write(`<html><head><title>${esc(o.id)}</title><style>body{font-family:Arial;max-width:760px;margin:30px auto;padding:20px}.box{border:1px solid #ddd;padding:25px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th:last-child,td:last-child{text-align:right}</style></head><body><div class="box"><h2>Charm and Corner Creations</h2><b>Order Receipt</b><p>Order ID: <b>${esc(o.id)}</b><br>Date: ${esc(o.date)}</p><hr><p><b>Customer:</b> ${esc(o.name)}<br><b>Phone:</b> ${esc(o.phone)}<br><b>Address:</b> ${esc(o.address)}<br><b>Payment:</b> ${esc(o.paymentLabel)}</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>${rows}</table><h3 style="text-align:right">Total: ৳${money(o.total)}</h3><p>Thank you for shopping with Charm and Corner Creations.</p></div></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function sendWhatsApp(i){const o=getOrders()[i];if(!o)return;const items=o.cart.map(p=>`${p.name} x${p.qty} - ৳${p.price*p.qty}`).join('\n');const msg=`Order ${o.id}\nCustomer: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.address}\nPayment: ${o.paymentLabel}\nItems:\n${items}\nTotal: ৳${o.total}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}
function deleteOrder(i){if(!confirm('Delete this order?'))return;const o=getOrders();o.splice(i,1);localStorage.setItem('cccOrders',JSON.stringify(o));render()}
function clearAll(){if(!getOrders().length)return;if(!confirm('Delete ALL saved orders? This cannot be undone.'))return;localStorage.removeItem('cccOrders');render()}
render();</script></body></html>
