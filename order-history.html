<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History - Charm and Corner Creations</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f7f4f2;margin:0;color:#222}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}.field{padding:9px;border:1px solid #ddd;border-radius:8px;width:120px}.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;background:#222;color:#fff}.danger{background:#b42318}.muted{color:#666;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{text-align:left;border-bottom:1px solid #eee;padding:8px;font-size:14px}</style></head><body><div class="wrap"><div class="row"><div><h1>Order History</h1><p>Charm and Corner Creations</p></div><a class="btn" href="admin.html">← Dashboard</a></div><section id="login" class="card"><h2>Owner Login</h2><input class="field" style="width:100%;margin:5px 0" id="email" type="email" placeholder="Supabase account email"><input class="field" style="width:100%;margin:5px 0" id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Sign In</button><p id="msg" class="muted"></p></section><section id="app" hidden><div class="row"><h2>Customer Orders</h2><div><button class="btn" onclick="importOldOrders()">Import Previous Browser Orders</button> <button class="btn" onclick="logout()">Log Out</button></div></div><p class="muted">If you have older orders saved in this browser, import them once after updating the website.</p><div id="orders"></div></section></div><script>
const sb=window.supabase.createClient('https://ozjpettsxppnkuzmdasb.supabase.co','sb_publishable_-0c0HEYYgE9KLcmlQ59I3A_XuelwOOP');let rows=[];const money=n=>Number(n||0).toLocaleString('en-BD');function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){msg.textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}await boot()}async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;loginSection();document.getElementById('app').hidden=false;await load()};function loginSection(){document.getElementById('login').hidden=true}
async function load(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){orders.innerHTML='<p>'+safe(error.message)+'</p>';return}rows=data||[];orders.innerHTML=rows.map(o=>{const items=Array.isArray(o.items)?o.items:[];return `<div class="card"><div class="row"><div><b>${safe(o.order_number||'Order')}</b><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><b>৳${money(o.total)}</b></div><p><b>Customer:</b> ${safe(o.customer_name)}<br><b>Phone:</b> ${safe(o.customer_phone)}<br><b>Address:</b> ${safe(o.customer_address)}<br><b>Status:</b> ${safe(o.status)}</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>${items.map(p=>`<tr><td>${safe(p.name)}</td><td>${Number(p.qty)}</td><td>৳${money(p.price)}</td><td>৳${money(Number(p.price)*Number(p.qty))}</td></tr>`).join('')}</table><p>Subtotal: ৳${money(o.subtotal)} | Discount: ৳${money(o.discount)} | <b>Final: ৳${money(o.total)}</b></p><label>Fixed discount (৳) <input class="field" id="d-${o.id}" type="number" min="0" value="${Number(o.discount||0)}"></label> <label>Status <select class="field" id="s-${o.id}"><option ${o.status==='pending'?'selected':''}>pending</option><option ${o.status==='confirmed'?'selected':''}>confirmed</option><option ${o.status==='processing'?'selected':''}>processing</option><option ${o.status==='completed'?'selected':''}>completed</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></label> <button class="btn" onclick="updateOrder('${o.id}')">Save Changes</button></div>`}).join('')||'<div class="card">No orders yet.</div>'}

async function importOldOrders(){const old=JSON.parse(localStorage.getItem('cccOrders')||'[]');if(!old.length)return alert('No previous browser orders were found on this device.');if(!confirm(`Import ${old.length} previous orders from this browser into Supabase?`))return;let done=0;for(const o of old){const orderNo=o.orderNo||o.order_number;if(!orderNo)continue;const {data:found,error:checkError}=await sb.from('orders').select('id').eq('order_number',orderNo).limit(1);if(checkError)return alert('Import stopped: '+checkError.message);if(found.length)continue;const items=Array.isArray(o.items)?o.items:[];const subtotal=Number(o.total)||items.reduce((sum,p)=>sum+Number(p.price)*Number(p.qty),0);const {error}=await sb.from('orders').insert({order_number:orderNo,customer_name:o.name||o.customer_name||'Customer',customer_phone:o.phone||o.customer_phone||'',customer_address:o.address||o.customer_address||'',items,subtotal,discount:0,total:subtotal,status:'pending'});if(error)return alert('Import stopped after '+done+' orders: '+error.message);done++;}alert(`${done} previous orders imported. Your old browser copy has been kept as a backup.`);await load()}
async function updateOrder(id){const o=rows.find(x=>x.id===id);const discount=Math.max(0,Number(document.getElementById('d-'+id).value)||0);if(discount>Number(o.subtotal))return alert('Discount cannot exceed subtotal.');const total=Number(o.subtotal)-discount,status=document.getElementById('s-'+id).value;const {error}=await sb.from('orders').update({discount,total,status}).eq('id',id);if(error)alert(error.message);else{alert('Order updated.');await load()}}
sb.auth.onAuthStateChange((e,s)=>{if(s)boot()});boot();
</script></body></html>
