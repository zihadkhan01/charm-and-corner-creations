<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History - Charm and Corner Creations</title><style>body{font-family:Arial,sans-serif;background:#fffaf7;color:#352b2b;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px 18px}h1{margin-bottom:5px}.top{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;background:#352b2b;color:#fff;padding:10px 15px;border-radius:9px;text-decoration:none;cursor:pointer}.danger{background:#a33}.order{background:#fff;border:1px solid #eadfd9;border-radius:14px;padding:18px;margin:15px 0}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#777}.items{width:100%;border-collapse:collapse;margin-top:12px}.items th,.items td{padding:7px;border-bottom:1px solid #eee;text-align:left}.total{text-align:right;font-size:18px;font-weight:bold}.empty{text-align:center;padding:50px;color:#777}</style></head><body><div class="wrap"><h1>Order History</h1><div class="muted">Charm and Corner Creations</div><div class="top"><a class="btn" href="index.html">← Back to Shop</a><button class="btn" onclick="load()">Refresh</button><button class="btn danger" onclick="clearAll()">Delete All Orders</button></div><div id="orders"></div></div><script>const money=n=>Number(n).toLocaleString('en-BD');function load(){const orders=JSON.parse(localStorage.getItem('cccOrders')||'[]');document.getElementById('orders').innerHTML=orders.length?orders.map((o,i)=>`<div class="order"><div class="head"><div><b>${o.orderNo}</b><br><span class="muted">${o.date}</span></div><div><b>৳${money(o.total)}</b></div></div><p><b>Customer:</b> ${o.name}<br><b>Phone:</b> ${o.phone}<br><b>Address:</b> ${o.address}<br><b>Payment:</b> ${o.payment}</p><table class="items"><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>${o.items.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>৳${money(p.price)}</td><td>৳${money(p.price*p.qty)}</td></tr>`).join('')}</table><p class="total">Total: ৳${money(o.total)}</p><button class="btn" onclick='printReceipt(${JSON.stringify(o).replace(/'/g,"&#39;")})'>Print Receipt</button> <button class="btn danger" onclick="del(${i})">Delete</button></div>`).join(''):'<div class="empty">No orders yet.</div>'}function del(i){const o=JSON.parse(localStorage.getItem('cccOrders')||'[]');o.splice(i,1);localStorage.setItem('cccOrders',JSON.stringify(o));load()}function clearAll(){if(confirm('Delete all order history?')){localStorage.removeItem('cccOrders');load()}}function printReceipt(o){const rows=o.items.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>৳${money(p.price)}</td><td>৳${money(p.price*p.qty)}</td></tr>`).join('');const w=open('','_blank');w.document.write(`<html><head><title>${o.orderNo}</title><style>body{font-family:Arial;max-width:760px;margin:30px auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}</style></head><body><h1>Charm and Corner Creations</h1><p>Order No: <b>${o.orderNo}</b><br>Date: ${o.date}<br>Customer: ${o.name}<br>Phone: ${o.phone}<br>Address: ${o.address}<br>Payment: ${o.payment}</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>${rows}</table><h2 class="r">Grand Total: ৳${money(o.total)}</h2><p>Thank you for shopping with us!</p><script>onload=()=>print()<\/script></body></html>`);w.document.close()}load();</script></body></html>
